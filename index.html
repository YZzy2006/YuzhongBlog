<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨中的研发日志</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: #fafbfc;
      color: #24292f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 2rem;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
      user-select: none;
    }

    .logo:hover {
      transform: translate(3px, -3px) rotate(-2deg);
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
    }

    .logo:active {
      transform: translate(0, 1px) scale(0.92);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .logo svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #57606a;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #d0d7de;
      margin: 0 auto 2.5rem;
    }

    .status-card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
    }

    .status-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #57606a;
      margin-bottom: 0.75rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #e3b341;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 1rem;
      color: #24292f;
      line-height: 1.7;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }

    .tag {
      font-size: 0.8125rem;
      color: #57606a;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 2rem;
      padding: 0.35rem 1rem;
    }

    footer {
      font-size: 0.8125rem;
      color: #8b949e;
    }

    footer a {
      color: #0969da;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo" title="PaperPlane">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Paper airplane - matches PaperPlane_Cursors style -->
        <!-- Left wing (bottom face, slightly darker) -->
        <path d="M 18 78 L 72 20 L 52 52 Z"
              fill="#f0f0f0" stroke="#4a4a4a" stroke-width="3"
              stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Right wing (top face, white) -->
        <path d="M 72 20 L 88 72 L 52 52 Z"
              fill="#ffffff" stroke="#4a4a4a" stroke-width="3"
              stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Body / spine -->
        <path d="M 72 20 L 52 52"
              fill="none" stroke="#4a4a4a" stroke-width="3"
              stroke-linecap="round"/>
        <!-- Tail fold -->
        <path d="M 18 78 L 52 52"
              fill="none" stroke="#4a4a4a" stroke-width="3"
              stroke-linecap="round"/>
        <!-- Wing crease detail on right wing -->
        <path d="M 72 28 L 70 50"
              fill="none" stroke="#c0c0c0" stroke-width="1.5"
              stroke-linecap="round" opacity="0.6"/>
        <!-- Wing crease detail on left wing -->
        <path d="M 30 68 L 50 54"
              fill="none" stroke="#c0c0c0" stroke-width="1.5"
              stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>

    <h1>雨中的研发日志</h1>
    <p class="subtitle">记录软件开发中的每一次探索与实践，分享编程学习路上的真实经验与思考。</p>

    <div class="divider"></div>

    <div class="status-card">
      <div class="status-label">
        <span class="status-dot"></span>
        备案状态
      </div>
      <p class="status-text">
        本站正在进行 ICP 备案审核，内容正在筹备中，<br>预计近期开放，敬请期待。
      </p>
    </div>

    <div class="topics">
      <span class="tag">开发笔记</span>
      <span class="tag">编程实践</span>
      <span class="tag">技术总结</span>
      <span class="tag">项目作品</span>
    </div>

    <footer>
      <p>&copy; 2026 雨中的研发日志 &middot; <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">ICP 备案</a></p>
    </footer>
  </div>
</body>
</html>
