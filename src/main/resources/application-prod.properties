# Database (use environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yuzhong_blog}?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool (4核4G服务器，适当缩小连接池减少内存占用)
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.sql.init.mode=never

# Disable Swagger/OpenAPI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT (REQUIRED in production - set via environment variable)
jwt.secret=${JWT_SECRET}

# CORS (set your domain)
cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# 阿里云OSS配置
aliyun.oss.endpoint=oss-cn-guangzhou.aliyuncs.com
aliyun.oss.bucket-name=yuzhongblog
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}

# Phone login simulation mode (disabled in production)
app.phone.simulation=false

# SPA index.html filesystem path (Nginx serves frontend, keeps in sync)
app.spa.index-path=/www/wwwroot/shunjumc.cn/index.html

# Logging
logging.level.root=WARN
logging.level.com.ticketingsystem.yuzhonblog=INFO
