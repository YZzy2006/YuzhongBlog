# Database
spring.datasource.url=jdbc:mysql://localhost:3306/yuzhong_blog?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 数据库密码通过环境变量注入（默认 1234 仅用于本地 dev MySQL；生产必须设置 DB_PASSWORD）
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.show-sql=false

# JWT 签名密钥通过环境变量注入（本地开发请在 IDEA Run Configuration 或 shell 设置 JWT_SECRET）
jwt.secret=${JWT_SECRET:}

# AES 加密密钥通过环境变量注入（本地开发请在 IDEA Run Configuration 或 shell 设置 APP_ENCRYPTION_SECRET）
app.encryption.secret=${APP_ENCRYPTION_SECRET:}

# CORS (specific origin for dev, not wildcard)
cors.allowed-origins=http://localhost:5173,https://www.u1979504.nyat.app:38280

# 阿里云OSS配置（dev 环境）
aliyun.oss.endpoint=oss-cn-guangzhou.aliyuncs.com
aliyun.oss.bucket-name=yuzhongblog
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}

# Phone login simulation mode (returns verification code in response, dev only)
app.phone.simulation=true

# Skip schema.sql in dev (ddl-auto=update already manages schema)
spring.sql.init.mode=never

# Logging
logging.level.root=INFO
logging.level.com.ticketingsystem.yuzhonblog=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.orm=WARN
