# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA: create-drop for clean test isolation
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Prevent MySQL schema.sql from running against H2
spring.sql.init.mode=never

# Dummy OSS config for tests
aliyun.oss.endpoint=oss-cn-guangzhou.aliyuncs.com
aliyun.oss.bucket-name=test-bucket
aliyun.oss.access-key-id=test-key-id
aliyun.oss.access-key-secret=test-key-secret

# JWT (test value - not used in public endpoint tests)
jwt.secret=TestSecretKeyForUnitTests2026!@#$%^&*()_+MustBe256Bits

# AI Encryption Key (test value - 32-byte Base64-encoded AES key)
app.encryption.secret=YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmk=

# Disable SPA filter for cleaner test context
spring.main.allow-bean-definition-overriding=true
